[package]
name = "octofs"
version = "0.24.0"
edition = "2021"
authors = ["Muvon Un Limited <contact@muvon.io>"]
license = "Apache-2.0"
description = "Standalone MCP filesystem tools server — view, edit, shell, workdir"
homepage = "https://github.com/muvon/octofs"
repository = "https://github.com/muvon/octofs"
documentation = "https://github.com/muvon/octofs"
keywords = ["mcp", "ai", "filesystem", "cli", "tools"]
categories = ["development-tools", "command-line-utilities", "filesystem"]
readme = "README.md"
rust-version = "1.95"
exclude = [
    "tests/fixtures/*",
    "examples/*",
    ".github/*",
    "docs/*",
    "scripts/*",
    "*.md",
    "install.sh"
]

[[bin]]
name = "octofs"
path = "src/main.rs"

# Enable static linking
[profile.release]
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Reduce parallel code generation units for better optimization
panic = "abort"         # Abort on panic for smaller binary size
strip = true            # Strip symbols from binary
opt-level = "s"         # Optimize for size, but keep loop vectorization ("z" disables it)
overflow-checks = false # Disable overflow checks in release mode

[dependencies]
octolib = { version = "0.52.3", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "signal", "io-std", "io-util", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Image bytes `view` returns as an MCP image block.
base64 = "0.23.1"
anyhow = "1.0.104"
ignore = "0.4.34"
regex = "1.13.1"
rayon = "1.12.0"
tracing = { version = "0.1", features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }

# MCP SDK
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["codec"] }
# RFC 3339 task timestamps (SEP-2663); already in the tree through rmcp.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Remote filesystem support (SSH/SFTP), always compiled in.
# default-features = false drops russh's `rsa` feature: the `rsa` crate has no
# release with the RUSTSEC-2023-0071 (Marvin) fix, so RSA keys are unsupported —
# use ed25519/ecdsa keys and host keys instead. The `ring` crypto backend (not
# aws-lc-rs) is chosen because the Alpine/musl release builds have no cmake.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "3.0"

# Tree-sitter grammars for the `view` structural outline (`flags: "s"`), always
# compiled in — the ceiling is binary size and build time, not correctness.
# Versions mirror the octocode pins, which are known to work together.
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
# AST-pattern search (`view` with `ast: true`), ported from octocode. Grammar-
# agnostic core: it is generic over the tree-sitter grammars above and adds no
# tree-sitter dependency of its own, so it cannot conflict with their pins.
ast-grep-core = "0.51.0"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "3.5.0"
# Client feature for the in-process delivery tests in `server_tests.rs`;
# feature unification applies it to test builds only, never the shipped bin.
rmcp = { version = "3.9.0", features = ["client"] }

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true
rpath = false
